<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RataVideo IA v2.1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-white min-h-screen">
  <!-- Login -->
  <div id="loginModal" class="fixed inset-0 bg-black/90 flex items-center justify-center z-50">
    <div class="bg-zinc-900 p-10 rounded-3xl w-96 text-center">
      <h2 class="text-4xl font-bold mb-6">🎥 RataVideo IA</h2>
      <p class="text-zinc-400 mb-6">Tu Higgsfield Personal</p>
      <input type="password" id="loginPass" placeholder="Ingresa la contraseña" 
             class="w-full bg-zinc-800 p-4 rounded-2xl mb-6 text-lg focus:outline-none">
      <button onclick="login()" class="w-full bg-violet-600 hover:bg-violet-700 py-4 rounded-2xl text-xl font-bold">
        ENTRAR
      </button>
    </div>
  </div>

  <!-- App Principal -->
  <div id="mainApp" class="max-w-5xl mx-auto p-6 hidden">
    <h1 class="text-5xl font-bold text-center mb-2">🎥 <span class="text-violet-500">RataVideo IA</span> <span class="text-sm">v2.1</span></h1>
    <p class="text-center text-zinc-400 mb-8">Powered by fal.ai</p>

    <!-- Presets -->
    <div class="flex gap-3 justify-center mb-8 flex-wrap">
      <button onclick="usePreset(1)" class="px-6 py-3 bg-orange-600 hover:bg-orange-700 rounded-full transition">🐀 El Rata</button>
      <button onclick="usePreset(2)" class="px-6 py-3 bg-green-600 hover:bg-green-700 rounded-full transition">🐴 Burro-Coin</button>
      <button onclick="usePreset(3)" class="px-6 py-3 bg-pink-600 hover:bg-pink-700 rounded-full transition">🐱 Doña Garra</button>
    </div>

    <div class="bg-zinc-900 rounded-3xl p-8">
      <textarea id="prompt" rows="4" class="w-full bg-zinc-800 p-5 rounded-2xl text-lg focus:outline-none" 
        placeholder="Describe tu video aquí..."></textarea>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
        <div>
          <label class="block text-sm mb-2">Modelo</label>
          <select id="model" class="w-full bg-zinc-800 p-3 rounded-2xl">
            <option value="fal-ai/veo3">Veo 3.1 (Alta calidad)</option>
            <option value="fal-ai/kling-video/v2.5-turbo/pro/text-to-video">Kling 2.5 Turbo</option>
            <option value="fal-ai/wan-25-preview/text-to-video">Wan 2.5 (Económico)</option>
            <option value="fal-ai/seedance-2.0/fast/text-to-video">Seedance 2.0</option>
          </select>
        </div>
        <div>
          <label class="block text-sm mb-2">Duración (segundos)</label>
          <input type="range" id="duration" min="4" max="12" value="6" class="w-full accent-violet-500">
          <p id="durationText" class="text-center text-sm mt-1">6 segundos</p>
        </div>
        <div>
          <label class="block text-sm mb-2">Formato</label>
          <select id="aspect" class="w-full bg-zinc-800 p-3 rounded-2xl">
            <option value="16:9">16:9 Horizontal</option>
            <option value="9:16">9:16 Vertical (Reels/TikTok)</option>
            <option value="1:1">1:1 Cuadrado</option>
          </select>
        </div>
        <div>
          <label class="block text-sm mb-2">Seed</label>
          <input type="number" id="seed" placeholder="Aleatorio" class="w-full bg-zinc-800 p-3 rounded-2xl">
        </div>
      </div>

      <div class="mt-6">
        <label class="block text-sm mb-2">Negative Prompt</label>
        <input id="negative" class="w-full bg-zinc-800 p-3 rounded-2xl" placeholder="borroso, feo, deformado, baja calidad...">
      </div>

      <div class="mt-6">
        <label class="block text-sm mb-2">URL de Imagen (Image-to-Video)</label>
        <input type="url" id="imageUrl" class="w-full bg-zinc-800 p-3 rounded-2xl" placeholder="Pega aquí la URL de El Rata, Doña Garra, etc.">
      </div>

      <button onclick="generarVideo()" 
        class="mt-10 w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 py-6 rounded-2xl text-xl font-bold hover:scale-105 transition flex items-center justify-center gap-3">
        <i class="fas fa-bolt"></i> GENERAR VIDEO
      </button>
    </div>

    <!-- Resultado -->
    <div id="result" class="hidden mt-12">
      <h3 class="text-2xl mb-4">🎞️ Video Generado</h3>
      <video id="videoPlayer" controls class="w-full rounded-2xl shadow-2xl"></video>
      <a id="downloadBtn" href="#" class="mt-6 inline-block bg-green-600 px-8 py-4 rounded-2xl text-lg font-semibold">⬇️ Descargar Video</a>
    </div>

    <!-- Historial -->
    <div class="mt-16">
      <h3 class="text-xl mb-4">📜 Historial</h3>
      <div id="history" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
    </div>
  </div>

  <script>
    const PASSWORD = "1075688202";

    function login() {
      const pass = document.getElementById('loginPass').value;
      if (pass === PASSWORD) {
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('mainApp').classList.remove('hidden');
      } else {
        alert("Contraseña incorrecta");
      }
    }

    function usePreset(n) {
      const presets = {
        1: "El Rata, rata antropomórfica cínica con traje gris desgastado, corbata amarilla manchada, calculadora rota, diente de oro, expresión sarcástica, callejón con neón",
        2: "Burro-Coin, burro antropomórfico con sudadera verde y gorra HUSTLE, expresión ingenua, sosteniendo tableta con gráfico bajando, estilo streetwear urbano",
        3: "Doña Garra, gata persa blanca arrogante con collar de perlas y bata morada, sentada en almohada sobre cubo de basura, mirada crítica, callejón nocturno"
      };
      document.getElementById('prompt').value = presets[n];
    }

    function saveToHistory(prompt, videoUrl) {
      let history = JSON.parse(localStorage.getItem('rvHistory') || '[]');
      history.unshift({ prompt: prompt.substring(0, 70) + "...", url: videoUrl, date: new Date().toLocaleString() });
      if (history.length > 12) history.pop();
      localStorage.setItem('rvHistory', JSON.stringify(history));
      loadHistory();
    }

    function loadHistory() {
      const history = JSON.parse(localStorage.getItem('rvHistory') || '[]');
      const html = history.map(item => `
        <div class="bg-zinc-900 rounded-2xl overflow-hidden">
          <video src="${item.url}" class="w-full h-40 object-cover"></video>
          <p class="p-3 text-xs text-zinc-400">${item.date}</p>
        </div>
      `).join('');
      document.getElementById('history').innerHTML = html;
    }

    async function generarVideo() {
      const prompt = document.getElementById('prompt').value.trim();
      if (!prompt) return alert("Escribe un prompt");

      const btn = document.querySelector('button[onclick="generarVideo()"]');
      btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Generando...`;
      btn.disabled = true;

      try {
        const res = await fetch('/generate', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${PASSWORD}`
          },
          body: JSON.stringify({
            prompt,
            model: document.getElementById('model').value,
            duration: document.getElementById('duration').value,
            aspect: document.getElementById('aspect').value,
            imageUrl: document.getElementById('imageUrl').value || null,
            negative_prompt: document.getElementById('negative').value,
            seed: document.getElementById('seed').value || null
          })
        });

        const data = await res.json();

        if (data.success && data.output && data.output.video_url) {
          const videoUrl = data.output.video_url;
          document.getElementById('videoPlayer').src = videoUrl;
          document.getElementById('downloadBtn').href = videoUrl;
          document.getElementById('result').classList.remove('hidden');
          saveToHistory(prompt, videoUrl);
        } else {
          alert("Error al generar el video. Revisa tu API Key.");
        }
      } catch (e) {
        alert("Error: " + e.message);
      }

      btn.innerHTML = `<i class="fas fa-bolt"></i> GENERAR VIDEO`;
      btn.disabled = false;
    }

    // Inicializar
    window.onload = () => {
      const slider = document.getElementById('duration');
      const text = document.getElementById('durationText');
      slider.addEventListener('input', () => text.textContent = slider.value + " segundos");
      loadHistory();
    };
  </script>
</body>
</html>
